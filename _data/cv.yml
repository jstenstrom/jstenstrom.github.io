    Publications:
      - title: History of Machinery and Political Cartoons
        authors:
          - Jacob Stenstrom
        publisher: New York State Economic Association
        releaseDate: 2018
        url: https://www.nyseconomicsassociation.org/wp-content/uploads/2022/06/conference-proceedings-2018.pdf#page=10
        summary: The introduction of the technological advances has, throughout history, been met with a reactionary force from the society it is introduced to. At its core societies heightened distaste of machines is a reflection of humanities interactions with the structure of capitalism. To understand the relationship between humanity and machinery, the medium of political cartoons is analyzed as a window into past and present tensions. The forces that separates humanity from its work already existed, but the introduction of new technology creates a greater acknowledgment of that separation.

